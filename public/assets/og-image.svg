<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gasCard" x1="0" y1="0" x2="340" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="dieselCard" x1="0" y1="0" x2="340" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Grid pattern -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="950" y1="0" x2="950" y2="630" />
  </g>

  <!-- Curva histórica de fondo -->
  <path d="M 60 520 Q 250 535, 420 500 T 760 410 T 1140 210" stroke="#38bdf8" stroke-width="5" stroke-opacity="0.35" fill="none" />
  <path d="M 60 470 Q 250 485, 420 445 T 760 350 T 1140 140" stroke="#fbbf24" stroke-width="5" stroke-opacity="0.4" fill="none" />

  <!-- Top Pill Badge -->
  <rect x="72" y="64" width="420" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
  <circle cx="98" cy="85" r="7" fill="#10b981" />
  <text x="118" y="91" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">DATOS OFICIALES MITECO · EXTREMADURA</text>

  <!-- Main Title -->
  <text x="72" y="175" font-family="DejaVu Sans, sans-serif" font-size="56" font-weight="bold" fill="#ffffff">Precio del Combustible</text>
  <text x="72" y="242" font-family="DejaVu Sans, sans-serif" font-size="56" font-weight="bold" fill="#38bdf8">en Extremadura Hoy</text>

  <text x="72" y="295" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#94a3b8">Gasolina 95 E5 y Gasóleo A en Badajoz, Cáceres y los 179 municipios.</text>
  <text x="72" y="328" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#94a3b8">Actualización diaria a las 06:00h y serie histórica 2025–2026.</text>

  <!-- Cards Row -->
  <!-- Card 1: Gasolina 95 -->
  <g transform="translate(72, 368)">
    <rect width="330" height="164" rx="20" fill="url(#gasCard)" stroke="#0284c7" stroke-width="2" />
    <circle cx="34" cy="38" r="8" fill="#38bdf8" />
    <text x="52" y="44" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#bae6fd">GASOLINA 95 E5</text>
    <text x="28" y="104" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="bold" fill="#ffffff">Media Hoy</text>
    <text x="28" y="140" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#7dd3fc">Surtidores Badajoz y Cáceres</text>
  </g>

  <!-- Card 2: Gasóleo A -->
  <g transform="translate(432, 368)">
    <rect width="330" height="164" rx="20" fill="url(#dieselCard)" stroke="#d97706" stroke-width="2" />
    <circle cx="34" cy="38" r="8" fill="#fbbf24" />
    <text x="52" y="44" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#fde68a">GASÓLEO A (DIÉSEL)</text>
    <text x="28" y="104" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="bold" fill="#ffffff">Media Hoy</text>
    <text x="28" y="140" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#fcd34d">Comparativa por localidad</text>
  </g>

  <!-- Card 3: Histórico 2025-2026 -->
  <g transform="translate(792, 368)">
    <rect width="336" height="164" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <circle cx="34" cy="38" r="8" fill="#10b981" />
    <text x="52" y="44" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#a7f3d0">SERIE 2025 - 2026</text>
    <text x="28" y="104" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">+420 EESS</text>
    <text x="28" y="140" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#94a3b8">Evolución diaria y récords</text>
  </g>

  <!-- Footer bar -->
  <text x="72" y="590" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#e2e8f0">combustible.antoniohorrillo.com</text>
  <text x="865" y="590" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#94a3b8">Por Antonio Horrillo</text>
</svg>

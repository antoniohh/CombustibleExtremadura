name: Actualizar Precios Diarios y Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Ejecución diaria a las 06:00 AM hora peninsular española (CET UTC+1 = 05:00 UTC)
    # para que a las 07:00 AM todos los conductores tengan los precios del día actualizados
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Capturar precios del día en Extremadura (MITECO API)
        run: npm run actualizar:hoy

      - name: Compilar SPA estática con Astro
        run: npm run build:fast

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
